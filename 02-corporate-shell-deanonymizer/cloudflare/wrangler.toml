name = "mpls-rental-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[triggers]
# Daily full-cycle reset, plus a 15-minute tick that resumes unfinished
# jurisdictions within the D1 queries-per-invocation budget.
crons = ["0 4 * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "social-housing-db"
database_id = "d95726b6-247d-4400-abb8-7cc97e4e4f7c"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "landlord-directory-data"

[observability]
enabled = true

