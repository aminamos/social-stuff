name = "mpls-rental-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[triggers]
crons = ["0 4 * * *"] # Daily at 4:00 AM UTC

[[d1_databases]]
binding = "DB"
database_name = "mpls-housing-db"
database_id = "<YOUR_D1_DATABASE_ID>"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "mpls-rental-registry"
