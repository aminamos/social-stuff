name: wrangler-scope

on:
  push:
    paths:
      - "scripts/wr"
      - "scripts/check_wrangler_scope.py"
      - ".github/workflows/wrangler-scope.yml"
      - "**.py"
      - "**.sh"
      - "**.md"
      - "**.jsonc"
      - "**.toml"
      - "**.yml"
      - "**.sql"
  pull_request:
    paths:
      - "scripts/wr"
      - "scripts/check_wrangler_scope.py"
      - ".github/workflows/wrangler-scope.yml"
      - "**.py"
      - "**.sh"
      - "**.md"
      - "**.jsonc"
      - "**.toml"
      - "**.yml"
      - "**.sql"

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No bare wrangler data-plane commands
        run: python3 scripts/check_wrangler_scope.py
      - name: Wrapper guard self-test
        run: bash scripts/wr --self-test
