name: unified-registry

on:
  push:
    paths:
      - "social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-unified/**"
      - ".github/workflows/unified-registry.yml"
  pull_request:
    paths:
      - "social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-unified/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: CSV export tests
        run: deno test --no-check --sloppy-imports src/csv-export.test.ts
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-unified
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-unified/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-unified
      - name: Typecheck
        run: npm run typecheck
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-unified
