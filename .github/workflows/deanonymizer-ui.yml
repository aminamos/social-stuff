name: deanonymizer-ui

on:
  push:
    paths:
      - "social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare/**"
      - ".github/workflows/deanonymizer-ui.yml"
  pull_request:
    paths:
      - "social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare
      - name: Unit tests
        run: npm test
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare
