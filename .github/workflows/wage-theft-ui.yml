name: wage-theft-ui

on:
  push:
    paths:
      - "social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-wage-theft/**"
      - ".github/workflows/wage-theft-ui.yml"
  pull_request:
    paths:
      - "social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-wage-theft/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        run: deno check src/ui.ts src/ui.test.ts src/data.ts
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-wage-theft
      - name: Unit tests
        run: deno test src/ui.test.ts
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-wage-theft
      - name: Docs route tests
        run: deno test --no-check --sloppy-imports src/docs-route.test.ts
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-wage-theft
      - name: CSV export tests
        run: deno test --no-check --sloppy-imports src/csv-export.test.ts
        working-directory: social-tokens-projects/02-corporate-shell-deanonymizer/cloudflare-wage-theft
